services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: cloudschedule-db
    environment:
      POSTGRES_USER: cloudschedule
      POSTGRES_PASSWORD: cloudschedule_password
      POSTGRES_DB: cloudschedule
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudschedule"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudschedule-backend
    environment:
      DATABASE_URL: postgresql://cloudschedule:cloudschedule_password@db:5432/cloudschedule?schema=public
      JWT_SECRET: your-secret-key-change-in-production
      PORT: 5000
      FRONTEND_URL: http://localhost:18080
    ports:
      - "18081:5000"
    depends_on:
      db:
        condition: service_healthy

  # Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:18081/api
    container_name: cloudschedule-frontend
    ports:
      - "18080:80"
    depends_on:
      - backend

volumes:
  postgres_data:

